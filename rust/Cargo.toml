[package]
name = "posea-prover"
version = "0.1.0"
edition = "2021"
description = "Driving a TPM 2.0 from the prover's side, on Linux and Windows, with no TSS and no tpm2-tools"
license = "MIT"

[dependencies]
serde_json = "1"

[profile.release]
# Deliberately plain. lto + panic="abort" + strip turn a first-run fault into a silent vanish on a
# machine you do not own, which is exactly what gets reported as "it does nothing".
opt-level = "s"
